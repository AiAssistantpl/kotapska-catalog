<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KOTAPSKA - Stock collection</title>
<meta name="description" content="KOTAPSKA Bridal Couture - stock gowns for bridal salons. Choose models and request prices.">
<style>
@font-face{font-family:Man;src:url(fonts/Manrope.ttf);font-weight:200 800;font-display:swap}
@font-face{font-family:Lor;src:url(fonts/Lora-Italic-Variable.ttf);font-style:italic;font-display:swap}
:root{--bg:#fff;--ink:#4f5151;--mut:#7a7c7c;--line:#e1e1e1;--soft:#f6f5f3;--acc:#b5b1ac;--btn:#4f5151;--btnt:#fff;--ok:#5b7a5f;--err:#a14a4a}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--ink:#e6e4e1;--mut:#a3a19d;--line:#2f2f2f;--soft:#1f1f1f;--acc:#8f8b86;--btn:#e6e4e1;--btnt:#161616}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Man,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.it{font-family:Lor,Georgia,serif;font-style:italic;font-weight:400}
a{color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
.logo{height:34px;display:block}
@media (prefers-color-scheme:dark){.logo{filter:invert(1) brightness(1.6)}}
.langs{display:flex;gap:2px}
.langs button{background:none;border:0;color:var(--mut);font:600 12px Man,sans-serif;letter-spacing:.12em;padding:10px 9px;min-height:44px;cursor:pointer;border-radius:6px}
.langs button[aria-pressed=true]{color:var(--ink);background:var(--soft)}
.hero{max-width:1180px;margin:0 auto;padding:44px 20px 18px}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--acc);margin:0 0 10px}
h1{font-family:Lor,Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(32px,6vw,52px);line-height:1.1;margin:0 0 14px;color:var(--mut)}
.lead{max-width:640px;color:var(--mut);margin:0}
.tools{max-width:1180px;margin:0 auto;padding:12px 20px 8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.chip{border:1px solid var(--line);background:none;color:var(--ink);padding:0 16px;min-height:44px;border-radius:22px;font:500 14px Man,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.search{border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;border-radius:22px;padding:0 16px;font:16px Man,sans-serif;width:150px}
main{max-width:1180px;margin:0 auto;padding:8px 20px 140px}
.count{font-size:13px;color:var(--mut);margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 18px}
.card{display:flex;flex-direction:column;min-width:0}
.ph{position:relative;display:block;width:100%;aspect-ratio:2/3;background:var(--soft);border:0;padding:0;cursor:pointer;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
@media (hover:hover){.ph:hover img{transform:scale(1.03)}}
.tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:#4f5151;font-size:11px;letter-spacing:.06em;padding:3px 9px;border-radius:12px}
.meta{padding:10px 2px 0}
.num{font-family:Lor,Georgia,serif;font-style:italic;font-size:22px;color:var(--mut);line-height:1.2}
.sub{font-size:12px;color:var(--mut);letter-spacing:.02em;margin:2px 0 10px}
.add{width:100%;min-height:46px;border-radius:23px;border:1px solid var(--btn);background:none;color:var(--ink);font:600 13px Man,sans-serif;letter-spacing:.06em;cursor:pointer}
.add[aria-pressed=true]{background:var(--btn);color:var(--btnt)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -6px 24px rgba(0,0,0,.08)}
.bar:not(.on) #barTxt{color:var(--mut)}
.bar:not(.on) .btn{opacity:.6}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.bar b{font-weight:700}
.btn{min-height:48px;padding:0 26px;border-radius:24px;border:0;background:var(--btn);color:var(--btnt);font:700 14px Man,sans-serif;letter-spacing:.06em;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(20,20,20,.55);display:none;z-index:50;align-items:flex-start;justify-content:center;overflow:auto;padding:0}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:980px;min-height:100%;position:relative;padding:26px 22px 0}
@media (min-width:900px){.sheet{margin:30px 0;min-height:0;border-radius:6px}}
.x{position:sticky;top:0;float:right;margin:-16px -12px 0 0;width:48px;height:48px;border:0;background:var(--bg);color:var(--ink);font-size:30px;cursor:pointer;line-height:1;z-index:3;border-radius:24px}
.stk{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:8px;z-index:2;border-top:1px solid var(--line)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 18px}
.gal img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--soft)}
@media (max-width:640px){.gal{grid-template-columns:1fr 1fr}.gal img:first-child{grid-column:1/3;aspect-ratio:3/4}}
.dh{font-family:Lor,Georgia,serif;font-style:italic;font-size:34px;color:var(--mut);margin:0 0 2px}
.dl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:0 0 14px}
.row{margin:0 0 14px}
.row h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:0 0 8px;font-weight:600}
.sz{display:flex;flex-wrap:wrap;gap:8px}
.sz button{min-width:48px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:none;color:var(--ink);font:600 14px Man,sans-serif;cursor:pointer}
.sz button[aria-pressed=true]{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.list{list-style:none;margin:0 0 18px;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li img{width:46px;height:69px;object-fit:cover;background:var(--soft)}
.li .t{flex:1;min-width:0}
.li .t b{font-family:Lor,Georgia,serif;font-style:italic;font-weight:400;font-size:20px;color:var(--mut)}
.li .t small{display:block;color:var(--mut);font-size:12px}
.rm{border:0;background:none;color:var(--mut);font-size:13px;cursor:pointer;min-height:44px;padding:0 6px;text-decoration:underline}
form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px Man,sans-serif;padding:10px 14px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut)}
.chk input{margin-top:3px;width:20px;height:20px;flex:none}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.msg{font-size:14px;min-height:20px}.msg.err{color:var(--err)}
.done{display:none;text-align:center;padding:40px 10px}
.done h3{font-family:Lor,Georgia,serif;font-style:italic;font-weight:400;font-size:34px;color:var(--mut);margin:0 0 8px}
footer{border-top:1px solid var(--line);padding:26px 20px 150px;text-align:center;font-size:12px;color:var(--mut);letter-spacing:.04em}
footer a{text-decoration:underline}
.note{font-size:12px;color:var(--mut);margin:0 0 12px}
</style>
</head>

<header>

</div></div>

function buildChips(){
  var c=$("chips");c.textContent="";
  var cols=["all"].concat(ORDER.filter(function(o){return IDS.some(function(m){return DATA[m].c===o})}));
  cols.forEach(function(k){var b=el("button","chip",k==="all"?tx.all:tx.coll[k]);b.setAttribute("aria-pressed",filter===k?"true":"false");b.onclick=function(){filter=k;buildChips();render()};c.appendChild(b)});
}
function render(){
  var g=$("grid");g.textContent="";var n=0;
  IDS.forEach(function(m){
    var d=DATA[m];if(filter!=="all"&&d.c!==filter)return;if(term&&m.indexOf(term)===-1)return;n++;
    var c=el("article","card");
    var ph=el("button","ph");ph.type="button";ph.setAttribute("aria-label",m);
    var im=new Image();im.src="t/"+m+".jpg";im.alt=m+" - KOTAPSKA";im.loading="lazy";im.decoding="async";ph.appendChild(im);
    ph.appendChild(el("span","tag",tx.coll[d.c]));ph.onclick=function(){openModal(m)};
    var mt=el("div","meta");mt.appendChild(el("div","num",m));mt.appendChild(el("div","sub",tx.sizes.replace(/\s*\(.*\)/,"")+": "+szText(m)));
    var a=el("button","add");a.type="button";setAdd(a,m);a.onclick=function(){toggle(m);setAdd(a,m)};
    mt.appendChild(a);c.appendChild(ph);c.appendChild(mt);g.appendChild(c);
  });
  $("count").textContent=n+" "+tx.models;
}
function setAdd(b,m){var on=!!cart[m];b.setAttribute("aria-pressed",on?"true":"false");b.textContent=on?"✓ "+tx.added:"+ "+tx.add}
function toggle(m,sizes){
  if(cart[m]&&sizes===undefined){delete cart[m]}else{cart[m]={s:sizes||(cart[m]&&cart[m].s)||[]}}
  save();updateBar();
}
function updateBar(){
  var n=cartCount();var b=$("bar");b.classList.toggle("on",n>0);
  var t=$("barTxt");t.textContent="";t.style.color="";
  if(n>0){var s=document.createElement("span");var bb=document.createElement("b");bb.textContent=n;s.appendChild(bb);s.appendChild(document.createTextNode(" "+tx.items));t.appendChild(s)}else{t.textContent=tx.none}
  $("barBtn").textContent=tx.sendReq;
}
var openM=null,msel=[];
function openModal(m,keep){
  openM=m;var d=DATA[m];
  var g=$("mGal");g.textContent="";d.p.forEach(function(p,i){var im=new Image();im.src=p;im.alt=m+" - "+(i+1);im.decoding="async";if(i>0)im.loading="lazy";g.appendChild(im)});
  $("mNum").textContent=m;$("mColl").textContent=tx.coll[d.c];
  if(!keep)msel=(cart[m]&&cart[m].s||[]).slice();
  var s=$("mSz");s.textContent="";
  d.s.forEach(function(z){var b=el("button",null,z);b.type="button";b.setAttribute("aria-pressed",msel.indexOf(z)>-1?"true":"false");b.onclick=function(){var i=msel.indexOf(z);if(i>-1)msel.splice(i,1);else msel.push(z);b.setAttribute("aria-pressed",i>-1?"false":"true");if(cart[m])toggle(m,msel.slice());};s.appendChild(b)});
  $("mCol").textContent=d.col.join(", ");$("mStock").textContent=d.u+" "+tx.pcs;
  var a=$("mAdd");function lab(){var on=!!cart[m];a.textContent=on?"✓ "+tx.added+" - "+tx.remove:"+ "+tx.add}
  lab();a.onclick=function(){if(cart[m])toggle(m);else toggle(m,msel.slice());lab();render()};
  $("ovM").classList.add("on");document.body.style.overflow="hidden";
  if(!keep){try{history.replaceState(null,"","?model="+m+"&lang="+L)}catch(e){}}
}
function closeAll(){
  ["ovM","ovR"].forEach(function(i){$(i).classList.remove("on")});openM=null;document.body.style.overflow="";
  try{history.replaceState(null,"","?lang="+L)}catch(e){}
  render();
}
function renderReq(){
  var u=$("rList");u.textContent="";var ks=Object.keys(cart).filter(function(k){return DATA[k]});
  ks.forEach(function(m){
    var li=el("li","li");var im=new Image();im.src="t/"+m+".jpg";im.alt="";li.appendChild(im);
    var t=el("div","t");t.appendChild(el("b",null,m));t.appendChild(el("small",null,tx.coll[DATA[m].c]+(cart[m].s&&cart[m].s.length?" - "+tx.size+": "+cart[m].s.join(", "):"")));li.appendChild(t);
    var r=el("button","rm",tx.remove);r.type="button";r.onclick=function(){delete cart[m];save();updateBar();renderReq();render();if(!cartCount())closeAll()};li.appendChild(r);u.appendChild(li);
  });
}
function openReq(){renderReq();$("rBody").style.display="";$("rDone").style.display="none";$("rMsg").textContent="";$("rMsg").className="msg";$("rSend").disabled=false;$("rSend").textContent=tx.send;$("ovM").classList.remove("on");$("ovR").classList.add("on");document.body.style.overflow="hidden"}
$("barBtn").onclick=function(){if(!cartCount()){var t=$("barTxt");t.textContent=tx.empty;t.style.color="var(--err)";setTimeout(function(){t.style.color="";updateBar()},2600);return}openReq()};
Array.prototype.forEach.call(document.querySelectorAll("[data-close]"),function(b){b.onclick=closeAll});
["ovM","ovR"].forEach(function(i){$(i).addEventListener("click",function(e){if(e.target===this)closeAll()})});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll()});
$("langs").onclick=function(e){var l=e.target.getAttribute&&e.target.getAttribute("data-l");if(!l)return;L=l;try{localStorage.setItem("kt_lang",L)}catch(x){}applyLang()};
$("q").oninput=function(){term=this.value.replace(/\D/g,"");render()};

$("rForm").onsubmit=function(e){
  e.preventDefault();var f=this,msg=$("rMsg"),btn=$("rSend");msg.className="msg";msg.textContent="";
  var ks=Object.keys(cart).filter(function(k){return DATA[k]});
  if(!ks.length){msg.className="msg err";msg.textContent=tx.empty;return}
  var v=function(n){return(f.elements[n].value||"").trim()};
  var email=v("email");
  if(!v("salon")||!v("name")||!v("country")||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||!$("f_consent").checked){msg.className="msg err";msg.textContent=tx.err;return}
  if(f.elements.website.value)return;
  var lines=ks.map(function(m){var s=cart[m].s||[];return m+" ("+DATA[m].c+")"+(s.length?" - size: "+s.join(", "):"")});
  var models=lines.join("; ");if(v("note"))models+="\nComment: "+v("note");
  var p={salon:v("salon"),name:v("name"),country:v("country"),email:email,phone:v("phone"),need:["price list"],models:models,catalog_models:ks,consent:true,lang:L,source:"online-catalogue",page:location.href.split("?")[0],ts:new Date().toISOString(),website:""};
  Object.keys(TRK).forEach(function(k){if(k==="cid"){var c=TRK.cid.replace(/\D/g,"").slice(0,12);if(c)p.cid=c}else p[k]=TRK[k]});
  btn.disabled=true;btn.textContent=tx.sending;
  fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}).then(function(r){if(!r.ok)throw 0;
    cart={};save();updateBar();f.reset();$("rBody").style.display="none";$("rDone").style.display="block";render()
  }).catch(function(){msg.className="msg err";msg.textContent=tx.fail;btn.disabled=false;btn.textContent=tx.send});
};
applyLang();
var pm=qs.get("model");if(pm&&DATA[pm])openModal(pm);
</script>
</body>
</html>
